version: v1
address: 0.0.0.0:7373

tls:
  key:  /certs/kes-server.key
  cert: /certs/kes-server.crt
  ca:   /certs/ca.crt

admin:
  # Dedicated admin identity — distinct from the MinIO policy identity.
  # KES rejects configs where the same identity appears in both admin and a policy.
  identity: 205445f36ecb8ddc1331cb679359617ab61bf3a0b2642d31af416363457ff19d

policy:
  minio:
    allow:
      - /v1/key/create/*
      - /v1/key/generate/*
      - /v1/key/decrypt/*
      - /v1/key/bulk/decrypt
      - /v1/key/list/*
      - /v1/status
      - /v1/metrics
    identities:
      - 73758ed7012f16a3f5f8ed9cf18f029e7ad66be4cf0c17c63c75e17a80dd8898

keystore:
  fs:
    path: /data   # keys are stored in the container's /data tmpfs
