version: v1
address: 0.0.0.0:7373

tls:
  key:  /certs/kes-server.key
  cert: /certs/kes-server.crt
  ca:   /certs/ca.crt

admin:
  # Dedicated admin identity — distinct from the MinIO policy identity.
  # KES rejects configs where the same identity appears in both admin and a policy.
  identity: 1cce2f1847a14cdfa78fa2f659bf3deb4e5a064b3eb5a14e223aefc863abcb6f

policy:
  minio:
    allow:
      - /v1/key/create/*
      - /v1/key/generate/*
      - /v1/key/decrypt/*
      - /v1/key/bulk/decrypt
      - /v1/key/list/*
      - /v1/status
      - /v1/metrics
    identities:
      - 6ea05fd83a4220976acc42afdd476906bc994303388d76b7efa808d976dd03a4

keystore:
  fs:
    path: /data   # keys are stored in the container's /data tmpfs
